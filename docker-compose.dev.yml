services:
  # Backend Dev Service (Go + Air for hot reload)
  backend:
    container_name: litestat-backend-dev
    hostname: backend
    image: localhost/lgd-litestat-backend:dev
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./backend:/app # 소스코드 실시간 반영
      - ./data:/app/data # DuckDB + Parquet 데이터
    ports:
      - "8082:8080"
    environment:
      - DB_PATH=/app/data/analytics.duckdb
      - CGO_ENABLED=1
    restart: unless-stopped
    networks:
      litestat-dev:
        aliases:
          - backend

  # Frontend Dev Service (Svelte + Vite HMR)
  frontend:
    container_name: litestat-frontend-dev
    hostname: frontend
    image: localhost/lgd-litestat-frontend:dev
    working_dir: /app
    volumes:
      - ./frontend:/app # 소스코드 실시간 반영
      - /app/node_modules # node_modules는 이미지 내부 것 사용
    ports:
      - "8081:5173"
    depends_on:
      - backend
      - canvas-analysis
    networks:
      litestat-dev:
        aliases:
          - frontend
    restart: unless-stopped

  # Canvas Analysis Dev Service (Python FastAPI + uvicorn reload)
  canvas-analysis:
    container_name: litestat-canvas-dev
    hostname: canvas-analysis
    image: localhost/lgd-litestat-canvas:dev
    working_dir: /app
    volumes:
      - ./canvas-analysis:/app # 소스코드 실시간 반영
      - ./data:/data:ro # DuckDB read-only
    ports:
      - "8000:8000"
    entrypoint: []
    command: [ "/usr/local/bin/python3", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    environment:
      - LAKE_DIR=/data/lake
    networks:
      litestat-dev:
        aliases:
          - canvas-analysis
    restart: unless-stopped

  # Python Scheduler (수동 실행용)
  python-scheduler:
    container_name: litestat-scheduler-dev
    image: localhost/lgd-litestat-python:dev
    working_dir: /app
    volumes:
      - ./python-scheduler:/app # 소스코드 실시간 반영
    environment:
      - BACKEND_URL=http://backend:8080
    command: python main.py
    depends_on:
      - backend
    networks:
      litestat-dev:
        aliases:
          - python-scheduler
    restart: "no" # 수동 실행: docker compose -f docker-compose.dev.yml run python-scheduler

networks:
  litestat-dev:
    driver: bridge
